x-traefik_env: &traefik_env
  TRAEFIK_API_DASHBOARD: true
  TRAEFIK_ENTRYPOINTS_WEB: true
  TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
  TRAEFIK_ENTRYPOINTS_WEB_HTTP_ENCODEQUERYSEMICOLONS: true
  TRAEFIK_ENTRYPOINTS_WEBSECURE_HTTP_ENCODEQUERYSEMICOLONS: true
  TRAEFIK_ENTRYPOINTS_WEBSECURE: true
  TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"
  TRAEFIK_PROVIDERS_DOCKER: true
  TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false
  TRAEFIK_PROVIDERS_FILE_FILENAME: /etc/traefik_dynamic.yml
services:

  traefik:
    image: "traefik:v2.9"
    container_name: "traefik"
    command:
      #- "--log.level=DEBUG"
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.myresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.myresolver.acme.caserver=https://acme-v02.api.letsencrypt.org/directory"
      - "--certificatesresolvers.myresolver.acme.email=<email>"
      - "--certificatesresolvers.myresolver.acme.storage=/letsencrypt/acme.json"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.service=api@internal"
      - "traefik.http.routers.api.entryPoints=web"
      - "traefik.http.routers.api.rule=Host(`__DOMAIN__`)"
      - "traefik.http.services.api.loadbalancer.server.port=8080"
    environment: *traefik_env      
    ports:
      - "80:80"
      - "443:443"
      
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./letsencrypt:/letsencrypt"
      #- "./certs:/certs:ro"
      #- ./traefik_dynamic.yaml:/etc/traefik_dynamic.yml
      ## Uncomment for let's encrypt cert based off Domain
      #- ./_wildcard.c0a81dd8.nip.io+3-key.pem:/mnt/cert/privkey.pem:ro
        #- ./_wildcard.c0a81dd8.nip.io+3.pem:/mnt/cert/fullchain.pem:ro
  whoami:
    image: "traefik/whoami"
    container_name: "simple-service"
    ports:
      - "8012:80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`__DOMAIN__`) && PathPrefix(`/api-test`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.middlewares.strip.stripprefix.prefixes=/api-test"
      - "traefik.http.middlewares.strip.stripprefix.forceSlash=false"
      - "traefik.http.routers.whoami.middlewares=strip"
      - "traefik.http.routers.whoami.tls.certresolver=myresolver"


networks:
  default:
    name: traefik
    external: true